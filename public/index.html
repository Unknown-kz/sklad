<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Склад">
  <title>Склад</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Склад</h1>
    <span id="net" class="net"></span>
  </header>

  <main>
    <!-- Вход / регистрация -->
    <section id="v-auth" class="view on">
      <div class="card">
        <div class="seg" id="auth-seg">
          <button type="button" data-auth="login" class="on">Вход</button>
          <button type="button" data-auth="register">Регистрация</button>
        </div>
        <form id="f-auth">
          <div class="reg-only">
            <p class="muted" id="auth-note"></p>
            <div class="seg role">
              <label><input type="radio" name="role" value="seller" checked> Продавец</label>
              <label><input type="radio" name="role" value="store"> Магазин</label>
            </div>
            <label>Название
              <input name="name" placeholder="ИП Асанов / Магазин «Береке»">
            </label>
          </div>
          <label>Email
            <input name="email" type="email" required autocomplete="email">
          </label>
          <label>Пароль
            <input name="password" type="password" required minlength="6" autocomplete="current-password">
          </label>
          <button class="btn primary" type="submit">Войти</button>
          <p class="err" id="auth-err"></p>
        </form>
      </div>
    </section>

    <!-- Продавец: товары -->
    <section id="v-products" class="view">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Поиск товара…" autocomplete="off">
        <button class="btn primary" id="add-product" type="button">+ Товар</button>
      </div>
      <div class="stats" id="p-stats"></div>
      <ul class="list" id="p-list"></ul>
    </section>

    <!-- Продавец: отчёт за день -->
    <section id="v-report" class="view">
      <div class="datebar">
        <button class="btn" id="d-prev" type="button" aria-label="Предыдущий день">‹</button>
        <input type="date" id="d-date">
        <button class="btn" id="d-next" type="button" aria-label="Следующий день">›</button>
      </div>
      <div class="kpis" id="r-kpis"></div>
      <h3>По товарам</h3>
      <div id="r-items"></div>
      <h3>Операции</h3>
      <ul class="list" id="r-ops"></ul>
    </section>

    <!-- Магазин: каталог всех продавцов -->
    <section id="v-catalog" class="view">
      <input id="cq" type="search" placeholder="Поиск по всем продавцам…" autocomplete="off">
      <div class="chips" id="c-chips"></div>
      <ul class="list" id="c-list"></ul>
    </section>

    <!-- Магазин: продавцы -->
    <section id="v-sellers" class="view">
      <form id="f-join" class="card">
        <label>Код продавца
          <input name="code" required maxlength="6" placeholder="Например K7M2QX" autocapitalize="characters" autocomplete="off">
        </label>
        <button class="btn primary" type="submit">Подключить</button>
        <p class="err" id="join-err"></p>
      </form>
      <ul class="list" id="s-list"></ul>
    </section>

    <!-- Профиль -->
    <section id="v-profile" class="view">
      <div class="card" id="pr-info"></div>
      <div class="card seller-only" id="pr-code"></div>
      <div class="card seller-only">
        <h3>Магазины с доступом</h3>
        <ul class="list" id="pr-viewers"></ul>
      </div>
      <div class="card">
        <h3>Уведомления</h3>
        <p id="push-state" class="muted"></p>
        <button class="btn" id="push-on" type="button">Включить уведомления</button>
      </div>
      <div class="card" id="install-card" hidden>
        <button class="btn primary" id="install" type="button">Установить приложение</button>
      </div>
      <button class="btn danger" id="logout" type="button">Выйти</button>
    </section>
  </main>

  <nav class="tabs" id="tabs" hidden></nav>

  <dialog id="dlg"><form id="dlg-form"></form></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
